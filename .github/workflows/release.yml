# Runs when a maintainer pushes a tag <skill-name>-v<version>. Only org admins may create such tags
# (repository ruleset), so a contributor cannot start a release. It publishes nothing new: the notes link
# the exact approved download that the website serves, with its checksum.
name: release
on:
  push:
    tags: ["*-v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Checks
        run: |
          node tools/validate.mjs
          node tools/aicb-scan.mjs skills
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --no-banner --redact
      - name: Tag matches a released skill version
        run: node tools/validate.mjs --tag "${GITHUB_REF_NAME}"
      - name: Release notes
        run: node tools/release-notes.mjs "${GITHUB_REF_NAME}" > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
