name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Format, versions and file types
        run: node tools/validate.mjs
      - name: Static security scan
        run: node tools/aicb-scan.mjs skills
      - name: Secret scan (gitleaks, pinned)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --no-banner --redact
      - name: Citation file
        run: docker run --rm -v "$PWD:/app" -w /app citationcff/cffconvert:2.0.0 --validate
      - name: Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --accept 200,206,429 --exclude-path skills/*/evals "./**/*.md" llms.txt
          fail: true
